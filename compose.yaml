services:
  setup:
    build: .
    environment: &app_environment
      PWC_DATA_DIR: /app/data
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      CHROMA_MODE: http
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      PWC_GENERATION_MODEL: ${PWC_GENERATION_MODEL:-gpt-oss:20b}
      PWC_EMBEDDING_MODEL: ${PWC_EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
    volumes:
      - app-data:/app/data
      - hf-cache:/root/.cache/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      chroma:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        if [ -f /app/data/.initialized ]; then
          echo "Already initialized, skipping setup."
          exit 0
        fi
        python scripts/seed_retail_data.py && python scripts/ingest_corpus.py && touch /app/data/.initialized
    restart: "no"

  app:
    build: .
    ports:
      - "${PWC_APP_PORT:-8501}:8501"
    environment: *app_environment
    volumes:
      - app-data:/app/data
      - hf-cache:/root/.cache/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      chroma:
        condition: service_healthy
      setup:
        condition: service_completed_successfully

  chroma:
    image: chromadb/chroma:1.5.9
    ports:
      - "${PWC_CHROMA_PORT:-8000}:8000"
    volumes:
      - chroma-data:/data
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/8000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  app-data:
  chroma-data:
  hf-cache:
